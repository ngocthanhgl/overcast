<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        document.documentElement.setAttribute('data-theme', 'light');
        const s = localStorage.getItem('app_settings');
        if (s) {
          const parsed = JSON.parse(s);
          if (parsed.colorTheme) {
            document.documentElement.setAttribute('data-color-theme', parsed.colorTheme);
          } else {
            document.documentElement.setAttribute('data-color-theme', 'green');
          }
        } else {
          document.documentElement.setAttribute('data-color-theme', 'green');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-color-theme', 'green');
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="transparent">
    <meta name="theme-color" content="#00000000" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Solnim">
    <meta name="application-name" content="Solnim">
    <link rel="manifest" href="/manifest.json">
    <link rel="preload" href="https://fonts.cdnfonts.com/s/14955/ProductSans-Regular.woff" as="font" type="font/woff" crossorigin>
    <link rel="preload" href="https://fonts.cdnfonts.com/s/14955/ProductSans-Bold.woff" as="font" type="font/woff" crossorigin>
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>Solnim</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg))
            .catch(err => console.warn('SW failed:', err));
        });
      }
    </script>
  </head>
  <body>

    <!-- Pre-warm backdrop-filter GPU pipeline to prevent transparent visual flashes on load -->
    <div id="blur-prewarm" style="
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transform: translateZ(0);
      pointer-events: none;
      opacity: 0;
    " aria-hidden="true"></div>

    <!-- No splash plate. The Android launch window is the app background colour, and #root
         fades in (see index.css), so the UI is there immediately, just softened. -->
    <div id="root"></div>
    <script>
      // Safety net: if the bundle never mounts, still show the root after 4s.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root) root.classList.add('app-ready');
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
