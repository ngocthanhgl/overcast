<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        document.documentElement.setAttribute('data-theme', 'light');
        const s = localStorage.getItem('app_settings');
        if (s) {
          const parsed = JSON.parse(s);
          if (parsed.colorTheme) {
            document.documentElement.setAttribute('data-color-theme', parsed.colorTheme);
          } else {
            document.documentElement.setAttribute('data-color-theme', 'green');
          }
        } else {
          document.documentElement.setAttribute('data-color-theme', 'green');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-color-theme', 'green');
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="transparent">
    <meta name="theme-color" content="#00000000" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OVERCAST">
    <meta name="application-name" content="OVERCAST">
    <link rel="manifest" href="/manifest.json">
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>OVERCAST</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg))
            .catch(err => console.warn('SW failed:', err));
        });
      }
    </script>
  </head>
  <body>

    <!-- Pre-warm backdrop-filter GPU pipeline to prevent transparent visual flashes on load -->
    <div id="blur-prewarm" style="
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      transform: translateZ(0);
      pointer-events: none;
      opacity: 0;
    " aria-hidden="true"></div>

    <!-- Static first paint: shown until React mounts, then faded out by App. -->
    <div id="app-loading-screen" aria-hidden="true" style="
      position: fixed;
      inset: 0;
      z-index: 99990;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #ffffff;
      pointer-events: none;
    ">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="41" cy="24" r="12" fill="#f6b93b" />
        <path d="M20 45h23a10 10 0 0 0 1.4-19.9A14 14 0 0 0 18 29.6A8.5 8.5 0 0 0 20 45z" fill="#eef2f7" stroke="#8fa6c4" stroke-width="2.4" stroke-linejoin="round" />
      </svg>
      <span style="
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.32em;
        color: #8fa6c4;
        text-transform: uppercase;
      ">Overcast</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
