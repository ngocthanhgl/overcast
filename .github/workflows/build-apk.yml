name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - perf-and-fixes

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Scaffold Capacitor Android shell
        run: |
          npm i --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.overcast.pwa",
            "appName": "Overcast",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Stamp version
        run: |
          sed -i "s/versionCode 1$/versionCode $((100 + ${GITHUB_RUN_NUMBER}))/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Building signed release APK"
            ./gradlew assembleRelease
            UNSIGNED=$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -n1)
            if [ -z "$UNSIGNED" ]; then UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n1); fi
            BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$RUNNER_TEMP/overcast.apk" \
              "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" verify "$RUNNER_TEMP/overcast.apk"
            echo "APK_NAME=overcast-release-${{ github.run_number }}.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set - building a debug-signed APK. Uninstall the existing app before installing this build."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/overcast.apk"
            echo "APK_NAME=overcast-debug-${{ github.run_number }}.apk" >> "$GITHUB_ENV"
          fi

          cp "$RUNNER_TEMP/overcast.apk" "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: overcast-apk-${{ github.run_number }}
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Overcast APK ${{ github.run_number }}
          prerelease: true
          body: |
            Automated Android build from ${{ github.sha }}.

            - App ID: `app.overcast.pwa`
            - Download the `.apk` below and install it on your device.
          files: ${{ env.APK_NAME }}
