name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_AQI_PROXY_BASE: ${{ vars.VITE_AQI_PROXY_BASE }}
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # The Google SDK repo index occasionally 500s and makes sdkmanager fail; retry, and
          # accept the packages already baked into the runner image.
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            for attempt in 1 2 3; do
              if "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1; then
                break
              fi
              echo "sdkmanager attempt $attempt failed, retrying in 20s"
              sleep 20
            done
          fi
          test -d "$ANDROID_HOME/platforms/android-34" || { echo "::error::platforms;android-34 unavailable"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/34.0.0" || { echo "::error::build-tools;34.0.0 unavailable"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Scaffold Capacitor Android shell
        run: |
          npm i --no-save @capacitor/cli@6 @capacitor/android@6 @capacitor/assets @capacitor/geolocation@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.overcast.pwa",
            "appName": "Overcast",
            "webDir": "dist",
            "server": { "androidScheme": "https" },
            "plugins": {
              "SplashScreen": {
                "launchAutoHide": true,
                "launchShowDuration": 0,
                "backgroundColor": "#ffffff",
                "showSpinner": false
              }
            }
          }
          JSON
          npx cap add android
          npx cap sync android

      # No splash art: the launch window is a flat colour until the WebView paints. Capacitor's
      # theme points windowBackground at the generated splash bitmap, so the theme is repointed
      # here; the bitmaps themselves are deleted after the asset generator runs.
      - name: Point launch theme at a flat colour
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values/splash_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="splash_background">#ffffff</color>
          </resources>
          XML
          sed -i 's#@drawable/splash#@color/splash_background#g' android/app/src/main/res/values/styles.xml
          if [ -f android/app/src/main/res/values-v31/styles.xml ]; then
            sed -i 's#@drawable/splash#@color/splash_background#g' android/app/src/main/res/values-v31/styles.xml
          fi
          cat > android/app/src/main/res/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <!-- Android 12+ system splash: flat colour, no icon, no animation. -->
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="android:windowSplashScreenBackground">@color/splash_background</item>
              <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
            </style>
          </resources>
          XML

      - name: Generate app icon
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      # Runs after the generator so the splash bitmaps it just wrote are actually removed.
      - name: Remove splash art
        run: |
          rm -f android/app/src/main/res/drawable*/splash.png
          if find android/app/src/main/res -name 'splash.png' | grep -q .; then
            echo "::error::splash drawables still present"
            exit 1
          fi
          grep -q '@color/splash_background' android/app/src/main/res/values/styles.xml || { echo "::error::launch theme not repointed"; exit 1; }

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"; then
            sed -i 's#    <application#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$MANIFEST"
          fi
          grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST" || { echo "::error::Failed to add location permissions"; exit 1; }
          grep -q 'ACCESS_COARSE_LOCATION' "$MANIFEST" || { echo "::error::Failed to add coarse location permission"; exit 1; }
          grep -q 'POST_NOTIFICATIONS' "$MANIFEST" || { echo "::error::Failed to add notification permission"; exit 1; }

      - name: Stamp version
        run: |
          sed -i "s/versionCode .*/versionCode 1/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.0.0\"/" android/app/build.gradle

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are missing. This workflow never ships a debug-signed APK."
            exit 1
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          UNSIGNED=$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -n1)
          if [ -z "$UNSIGNED" ]; then UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n1); fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/overcast.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$RUNNER_TEMP/overcast.apk"

          APK_NAME="overcast-1.0.0.apk"
          cp "$RUNNER_TEMP/overcast.apk" "$GITHUB_WORKSPACE/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: overcast-apk
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Overcast v1.0.0
          prerelease: false
          overwrite_files: true
          body: |
            Automated Android build from ${{ github.sha }}.

            - App ID: `app.overcast.pwa`
            - Signed release APK, installs over previous builds signed with the same key.
          files: ${{ env.APK_NAME }}
