name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_AQI_PROXY_BASE: ${{ vars.VITE_AQI_PROXY_BASE }}
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # The Google SDK repo index occasionally 500s and makes sdkmanager fail; retry, and
          # accept the packages already baked into the runner image.
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            for attempt in 1 2 3; do
              if "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1; then
                break
              fi
              echo "sdkmanager attempt $attempt failed, retrying in 20s"
              sleep 20
            done
          fi
          test -d "$ANDROID_HOME/platforms/android-34" || { echo "::error::platforms;android-34 unavailable"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/34.0.0" || { echo "::error::build-tools;34.0.0 unavailable"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Scaffold Capacitor Android shell
        run: |
          npm i --no-save @capacitor/cli@6 @capacitor/android@6 @capacitor/geolocation@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.solnim.weather",
            "appName": "Solnim",
            "webDir": "dist",
            "server": { "androidScheme": "https" },
            "plugins": {
              "SplashScreen": {
                "launchAutoHide": true,
                "launchShowDuration": 0,
                "backgroundColor": "#dbe4eb",
                "showSpinner": false
              }
            }
          }
          JSON
          npx cap add android
          npx cap sync android

      # Brand launcher resources (adaptive icon, monochrome layer, per-density PNGs, app_name)
      # come straight from brand/launcher/res, so no icon generator is involved.
      - name: Apply Solnim launcher resources
        run: |
          cp -R brand/launcher/res/. android/app/src/main/res/
          # Capacitor's own values/strings.xml already declares app_name, so the brand file is
          # only a source of truth in the repo; the live value is patched in place.
          rm -f android/app/src/main/res/values/strings_app_name.xml
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Solnim</string>#' android/app/src/main/res/values/strings.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable-v24/ic_launcher_monochrome.xml
          grep -q '<string name="app_name">Solnim</string>' android/app/src/main/res/values/strings.xml
          rm -f android/app/src/main/res/drawable*/splash.png

      # Android WebView draws its own overlay scrollbars for the root scroller; CSS cannot hide
      # those, so they are switched off in the native WebView (with the overscroll glow).
      - name: Disable native scrollbars
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n1)
          if [ -z "$MAIN" ]; then
            echo "::error::MainActivity.java not found"
            exit 1
          fi
          grep -q '^package app.solnim.weather;' "$MAIN" || { echo "::error::unexpected package in $MAIN"; exit 1; }
          cat > "$MAIN" <<'JAVA'
          package app.solnim.weather;

          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideScrollbars();
            }

            @Override
            public void onStart() {
              super.onStart();
              hideScrollbars();
            }

            private void hideScrollbars() {
              try {
                final WebView webView = getBridge() != null ? getBridge().getWebView() : null;
                if (webView == null) return;
                apply(webView);
                webView.post(() -> apply(webView));
              } catch (Exception ignored) {
                // WebView not ready yet; onStart retries.
              }
            }

            private void apply(WebView webView) {
              webView.setVerticalScrollBarEnabled(false);
              webView.setHorizontalScrollBarEnabled(false);
              webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
            }
          }
          JAVA
          grep -q 'setVerticalScrollBarEnabled' "$MAIN"
          grep -q 'setHorizontalScrollBarEnabled' "$MAIN"
          grep -q 'OVER_SCROLL_NEVER' "$MAIN"

      # No splash art, no white flash. The launch window uses the colour the web app paints as
      # its background, and the navigation bar colour is set explicitly in *both* the launch and
      # the app theme: previously the launch window painted white behind the black system bars,
      # which is the "white expands over the navigation bar" flicker.
      - name: Point launch theme at the app background
        run: |
          python3 - <<'PY'
          import re, pathlib
          res = pathlib.Path('android/app/src/main/res')
          (res / 'values').mkdir(parents=True, exist_ok=True)
          (res / 'values-v31').mkdir(parents=True, exist_ok=True)

          (res / 'values' / 'splash_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '  <color name="splash_background">#dbe4eb</color>\n'
              '</resources>\n'
          )

          nav = ('  <item name="android:navigationBarColor">#FF000000</item>\n'
                 '  <item name="android:statusBarColor">@android:color/transparent</item>\n')

          styles_path = res / 'values' / 'styles.xml'
          styles = styles_path.read_text().replace('@drawable/splash', '@color/splash_background')

          def add_items(xml, style_name, items):
              pattern = re.compile(r'(<style name="%s"[^>]*>)(.*?)(</style>)' % re.escape(style_name), re.S)
              def repl(match):
                  if 'navigationBarColor' in match.group(2):
                      return match.group(0)
                  return match.group(1) + match.group(2) + items + match.group(3)
              return pattern.sub(repl, xml)

          styles = add_items(styles, 'AppTheme.NoActionBarLaunch', nav)
          styles = add_items(styles, 'AppTheme.NoActionBar', nav)
          styles_path.write_text(styles)

          (res / 'values-v31' / 'styles.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '  <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n'
              '    <item name="android:windowSplashScreenBackground">@color/splash_background</item>\n'
              '    <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>\n'
              '    <item name="android:navigationBarColor">#FF000000</item>\n'
              '    <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>\n'
              '  </style>\n'
              '</resources>\n'
          )

          patched = styles_path.read_text()
          assert '@color/splash_background' in patched, 'launch theme not repointed'
          assert patched.count('navigationBarColor') == 2, 'navigation bar colour missing'
          assert (res / 'values-v31' / 'styles.xml').read_text().count('windowSplashScreenBackground') == 1
          PY

      # Final guard: no splash bitmaps may survive (the template ships one) and the launch theme
      # must point at the flat app-background colour.
      - name: Assert no splash art
        run: |
          rm -f android/app/src/main/res/drawable*/splash.png
          if find android/app/src/main/res -name 'splash.png' | grep -q .; then
            echo "::error::splash drawables still present"
            exit 1
          fi
          grep -q '@color/splash_background' android/app/src/main/res/values/styles.xml || { echo "::error::launch theme not repointed"; exit 1; }
          grep -q 'navigationBarColor' android/app/src/main/res/values/styles.xml || { echo "::error::app theme missing nav bar colour"; exit 1; }

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"; then
            sed -i 's#    <application#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$MANIFEST"
          fi
          grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST" || { echo "::error::Failed to add location permissions"; exit 1; }
          grep -q 'ACCESS_COARSE_LOCATION' "$MANIFEST" || { echo "::error::Failed to add coarse location permission"; exit 1; }
          grep -q 'POST_NOTIFICATIONS' "$MANIFEST" || { echo "::error::Failed to add notification permission"; exit 1; }

      - name: Stamp version
        run: |
          sed -i "s/versionCode .*/versionCode 1/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.0.0\"/" android/app/build.gradle

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are missing. This workflow never ships a debug-signed APK."
            exit 1
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          UNSIGNED=$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -n1)
          if [ -z "$UNSIGNED" ]; then UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n1); fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/solnim.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$RUNNER_TEMP/solnim.apk"

          APK_NAME="solnim-1.0.0.apk"
          cp "$RUNNER_TEMP/solnim.apk" "$GITHUB_WORKSPACE/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: solnim-apk
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Solnim v1.0.0
          prerelease: false
          overwrite_files: true
          body: |
            Automated Android build from ${{ github.sha }}.

            - App ID: `app.solnim.weather`
            - Signed release APK, installs over previous builds signed with the same key.
          files: ${{ env.APK_NAME }}
